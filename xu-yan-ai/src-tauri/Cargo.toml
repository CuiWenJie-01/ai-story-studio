[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.11", features = ["json"] }
ureq = "2.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
base64 = "0.21"
open = "5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
futures = "0.3"
lazy_static = "1.4"
url = "2.5"
mysql = { version = "25", features = ["chrono"] }
bcrypt = "0.15"
once_cell = "1.0"
rand = "0.8"
regex = "1"
tauri-plugin-http = "2.5.8"
urlencoding = "2.1"
serde-xml-rs = "0.6"
ve-tos-rust-sdk = "2.9"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
